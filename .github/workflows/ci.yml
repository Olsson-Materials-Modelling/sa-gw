name: tests and demo
on: [push, pull_request]
env: {OMP_NUM_THREADS: 1, OPENBLAS_NUM_THREADS: 1, MKL_NUM_THREADS: 1}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: bash demo/run.sh
  installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install .
      - run: cd "$RUNNER_TEMP" && python -c "import sagw.descriptors, sagw.models, sagw.potential, sagw.sensitivity, sagw.spin"
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "numpy==1.24.*" "scipy==1.10.*" "pandas==2.0.*" "pyarrow==12.*" "scikit-learn==1.3.*" "matplotlib==3.7.*" pytest
      - run: pytest -q
      - run: bash demo/run.sh
